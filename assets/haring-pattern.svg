<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <style>
      .haring-line {
        fill: none;
        stroke: rgba(255, 255, 255, 0.22);
        stroke-width: 3.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .haring-fill {
        fill: rgba(255, 255, 255, 0.1);
      }
    </style>
  </defs>

  <!-- Keith Haring Style Figures & Doodles -->

  <!-- Figure 1: Dancing person with arms up -->
  <g transform="translate(40, 30)">
    <!-- Head -->
    <circle cx="35" cy="25" r="14" class="haring-line" />
    <!-- Torso -->
    <path d="M 35 39 L 35 80" class="haring-line" />
    <!-- Left Arm raised -->
    <path d="M 35 48 L 12 36 L 6 12" class="haring-line" />
    <!-- Right Arm raised -->
    <path d="M 35 48 L 58 36 L 64 12" class="haring-line" />
    <!-- Radiant lines above head -->
    <path d="M 22 6 L 15 0" class="haring-line" />
    <path d="M 35 5 L 35 -3" class="haring-line" />
    <path d="M 48 6 L 55 0" class="haring-line" />
    <!-- Left Leg bending -->
    <path d="M 35 80 L 15 95 L 8 120 L 0 120" class="haring-line" />
    <!-- Right Leg bending -->
    <path d="M 35 80 L 55 95 L 62 120 L 70 120" class="haring-line" />
    <!-- Motion lines -->
    <path d="M -8 50 C -12 60 -12 70 -8 80" class="haring-line" />
    <path d="M 78 50 C 82 60 82 70 78 80" class="haring-line" />
  </g>

  <!-- Radiant Barking Dog -->
  <g transform="translate(240, 50)">
    <!-- Dog body & head -->
    <path d="M 40 45 L 80 45 L 90 25 L 110 25 L 110 38 L 85 58 L 85 85 L 75 85 L 75 65 L 45 65 L 45 85 L 35 85 L 35 55 Z" class="haring-line" />
    <!-- Barking mouth & jaw -->
    <path d="M 100 25 L 112 18" class="haring-line" />
    <path d="M 105 38 L 118 45" class="haring-line" />
    <!-- Tail pointing up -->
    <path d="M 35 55 L 20 35 L 25 32" class="haring-line" />
    <!-- Bark rays -->
    <path d="M 125 15 L 138 10" class="haring-line" />
    <path d="M 130 30 L 145 30" class="haring-line" />
    <path d="M 125 45 L 138 50" class="haring-line" />
  </g>

  <!-- Radiant Heart -->
  <g transform="translate(150, 180)">
    <path d="M 50 35 C 50 15, 25 10, 25 35 C 25 55, 50 75, 50 85 C 50 75, 75 55, 75 35 C 75 10, 50 15, 50 35 Z" class="haring-line" />
    <!-- Heart rays -->
    <path d="M 10 20 L 0 10" class="haring-line" />
    <path d="M 5 45 L -8 45" class="haring-line" />
    <path d="M 15 70 L 5 80" class="haring-line" />
    <path d="M 90 20 L 100 10" class="haring-line" />
    <path d="M 95 45 L 108 45" class="haring-line" />
    <path d="M 85 70 L 95 80" class="haring-line" />
  </g>

  <!-- Figure 2: Crawling / Breakdancing figure -->
  <g transform="translate(30, 240)">
    <circle cx="30" cy="50" r="14" class="haring-line" />
    <!-- Horizontal body -->
    <path d="M 44 50 L 95 50" class="haring-line" />
    <!-- Arm supporting body -->
    <path d="M 60 50 L 60 85 L 50 85" class="haring-line" />
    <!-- Other arm reaching -->
    <path d="M 80 50 L 95 30 L 115 30" class="haring-line" />
    <!-- Legs in air -->
    <path d="M 95 50 L 115 75 L 135 65" class="haring-line" />
    <path d="M 115 75 L 125 100" class="haring-line" />
    <!-- Energy squiggles -->
    <path d="M 10 75 Q 20 85 30 75 T 50 75" class="haring-line" />
  </g>

  <!-- Spark / Star / Doodles -->
  <g transform="translate(300, 250)">
    <!-- 8-point spark -->
    <path d="M 30 0 L 30 60 M 0 30 L 60 30 M 10 10 L 50 50 M 50 10 L 10 50" class="haring-line" />
    <!-- Spiral energy -->
    <path d="M 70 80 Q 80 60 90 80 T 110 80" class="haring-line" />
  </g>

  <!-- Squiggle lines across borders -->
  <path d="M 0 160 Q 20 145 40 160 T 80 160 T 120 160" class="haring-line" />
  <path d="M 280 160 Q 300 145 320 160 T 360 160 T 400 160" class="haring-line" />
  <path d="M 180 340 Q 200 325 220 340 T 260 340" class="haring-line" />
</svg>
