<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 54 46" width="54" height="46" fill="none">
  <!-- Subtle shadow under cat -->
  <ellipse cx="26" cy="44" rx="16" ry="2.5" fill="rgba(0,0,0,0.2)" />

  <!-- Tail curled to the right with gentle wobble animation class -->
  <path class="sitting-cat-tail" d="M 38 38 C 45 36, 50 30, 48 23 C 46 18, 41 21, 43 26 C 44 29, 41 33, 36 36" stroke="#000000" stroke-width="2.2" stroke-linecap="round" fill="none" />

  <!-- Sitting Cat Body (Chubby sitting pose) -->
  <path d="M 16 28 C 14 34, 13 40, 14 43 C 15 44.5, 38 44.5, 39 43 C 40 40, 39 34, 37 28 Z" fill="#FFFFFF" stroke="#000000" stroke-width="2.2" stroke-linejoin="round" />

  <!-- Head with pointy ears (matching cat-follower doodle aesthetic) -->
  <path d="M 12 25 C 10 18, 11 11, 13 5 C 14 2, 18 5, 21 8 C 24 7.5, 29 7.5, 32 8 C 35 5, 39 2, 40 5 C 42 11, 43 18, 41 25 C 38 31, 15 31, 12 25 Z" fill="#FFFFFF" stroke="#000000" stroke-width="2.2" stroke-linejoin="round" />

  <!-- Inner Ears (Soft Pink) -->
  <polygon points="15,6 18,12 14,12" fill="#FFB6C1" />
  <polygon points="38,6 39,12 35,12" fill="#FFB6C1" />

  <!-- Left Eye (Big cute black pupil with specular white highlights) -->
  <g class="sitting-cat-eye">
    <ellipse cx="20.5" cy="18" rx="5.2" ry="6.2" fill="#000000" />
    <circle cx="19" cy="16.5" r="1.8" fill="#FFFFFF" />
    <circle cx="21.8" cy="20" r="0.8" fill="#FFFFFF" />
  </g>

  <!-- Right Eye (Big cute black pupil with specular white highlights) -->
  <g class="sitting-cat-eye">
    <ellipse cx="32.5" cy="18" rx="5.2" ry="6.2" fill="#000000" />
    <circle cx="31" cy="16.5" r="1.8" fill="#FFFFFF" />
    <circle cx="33.8" cy="20" r="0.8" fill="#FFFFFF" />
  </g>

  <!-- Cute Nose & Mouth -->
  <polygon points="26.5,22 25.5,23.5 27.5,23.5" fill="#000000" />
  <path d="M 24.5 25 Q 26.5 26.5 28.5 25" stroke="#000000" stroke-width="1.4" stroke-linecap="round" fill="none" />

  <!-- Whiskers -->
  <line x1="11" y1="19" x2="4" y2="17.5" stroke="#000000" stroke-width="1.2" stroke-linecap="round" />
  <line x1="11" y1="22" x2="5" y2="23" stroke="#000000" stroke-width="1.2" stroke-linecap="round" />
  <line x1="42" y1="19" x2="49" y2="17.5" stroke="#000000" stroke-width="1.2" stroke-linecap="round" />
  <line x1="42" y1="22" x2="48" y2="23" stroke="#000000" stroke-width="1.2" stroke-linecap="round" />

  <!-- Two Little Front Paws Resting Flat on Edge -->
  <path d="M 20 42 C 20 40, 23 40, 23 42 C 23 44, 20 44, 20 42 Z" fill="#FFFFFF" stroke="#000000" stroke-width="1.6" />
  <path d="M 28 42 C 28 40, 31 40, 31 42 C 31 44, 28 44, 28 42 Z" fill="#FFFFFF" stroke="#000000" stroke-width="1.6" />
</svg>
